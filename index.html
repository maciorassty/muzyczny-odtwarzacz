
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Selection</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 65px 20px 35px;
}

header h1 {
  color: #d6b46a;
  font-size: 38px;
  letter-spacing: 5px;
  margin-bottom: 12px;
}

header p {
  color: #aaa;
  letter-spacing: 2px;
  font-size: 13px;
}

.container {
  max-width: 750px;
  margin: 35px auto;
  padding: 20px;
}

.track {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 22px;
  margin-bottom: 14px;
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 10px;
}

.track-info h3 {
  margin: 0 0 7px;
  font-size: 16px;
}

.track-info p {
  margin: 0;
  color: #999;
  font-size: 12px;
}

button {
  background: #d6b46a;
  color: #111;
  border: none;
  border-radius: 30px;
  padding: 12px 23px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #f0d28d;
}

.player {
  background: #202020;
  padding: 25px;
  border: 1px solid #444;
  border-radius: 12px;
  margin-top: 35px;
}

.player h3 {
  color: #d6b46a;
  margin-top: 0;
}

audio {
  width: 100%;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 40px 15px;
  color: #666;
  font-size: 12px;
  letter-spacing: 2px;
}

@media(max-width: 500px) {
  header h1 {
    font-size: 28px;
  }
  .track {
    padding: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MUSIC SELECTION</h1>
  <p>LISTEN • DISCOVER • CHOOSE</p>
</header>

<main class="container">

  <h2 style="color:#d6b46a; text-align:center;">
    WYBIERZ UTWÓR
  </h2>

  <div id="tracks"></div>

  <div class="player">
    <h3 id="nowPlaying">Wybierz utwór</h3>
    <audio id="audioPlayer" controls preload="none"></audio>
  </div>

</main>

<footer>
  MUSIC SELECTION © 2026
</footer>

<script>
const songs = [
  {
    name: "Utwór 01",
    description: "Próbka muzyczna",
    file: "audio/utwor1.mp3"
  },
  {
    name: "Utwór 02",
    description: "Próbka muzyczna",
    file: "audio/utwor2.mp3"
  },
  {
    name: "Utwór 03",
    description: "Próbka muzyczna",
    file: "audio/utwor3.mp3"
  },
  {
    name: "Utwór 04",
    description: "Próbka muzyczna",
    file: "audio/utwor4.mp3"
  }
];

const list = document.getElementById("tracks");
const player = document.getElementById("audioPlayer");
const title = document.getElementById("nowPlaying");

songs.forEach((song) => {
  const item = document.createElement("div");
  item.className = "track";

  const info = document.createElement("div");
  info.className = "track-info";

  const name = document.createElement("h3");
  name.textContent = song.name;

  const desc = document.createElement("p");
  desc.textContent = song.description;

  info.appendChild(name);
  info.appendChild(desc);

  const button = document.createElement("button");
  button.textContent = "▶ ODTWÓRZ";

  button.addEventListener("click", () => {
    player.src = song.file;
    title.textContent = song.name;
    player.play();
  });

  item.appendChild(info);
  item.appendChild(button);
  list.appendChild(item);
});
</script>

</body>
</html>
